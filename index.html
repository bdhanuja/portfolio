document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const p=D.projects[b.dataset.i];
dg.innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px"><div><span class="tag t-${p.c}">${p.c}</span><h3 style="font-size:24px;margin-top:10px">${T(p.t)}</h3></div><button class="btn" id="x" aria-label="Close">✕</button></div>${p.img?`<img src="${esc(p.img)}" alt="${esc(p.t)} screenshot" style="width:100%;border-radius:12px;margin-top:16px">`:""}<dl><dt class="label">Problem</dt><dd>${T(p.p)}</dd><dt class="label">Key features</dt><dd>${list(p.f)}</dd></dl><div class="sec"><div class="label">Security angle: how could this be attacked or fail?</div><p class="muted" style="margin:6px 0 0;font-size:14px">${T(p.sec)}</p></div><div class="row">${p.gh?ext(p.gh,"GitHub","btn p"):""}${p.demo?ext(p.demo,"Live demo"):""}</div>`;

document.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>{const c=CL[b.dataset.ci];dg.innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><h3 style="font-size:18px">${esc(c.name)}</h3><button class="btn" id="x" aria-label="Close">✕</button></div><img src="${c.img}" alt="Certificate: ${esc(c.name)}" style="width:100%;margin-top:14px;border-radius:10px;border:1px solid var(--line)">`;dg.showModal();dg.querySelector("#x").onclick=()=>dg.close()});
/* contact form: validate, sanitize, mailto fallback (never a fake success) */
const cl=(s,n)=>s.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F<>]/g,"").trim().slice(0,n);
document.getElementById("f").onsubmit=e=>{e.preventDefault();const f=e.target,v={name:cl(f.name.value,80),email:cl(f.email.value,120),subject:cl(f.subject.value,120),message:cl(f.message.value,1500)},er={};
if(v.name.length<2)er.name="Enter your name.";if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email))er.email="Enter a valid email.";if(v.subject.length<3)er.subject="Add a subject.";if(v.message.length<10)er.message="Message needs at least 10 characters.";
["name","email","subject","message"].forEach(k=>document.getElementById("e-"+k).textContent=er[k]||"");const ok=document.getElementById("ok");ok.textContent="";if(Object.keys(er).length)return;
if(!mailOk){ok.textContent="Site owner: set social.email in the data block first.";return}
location.href=`mailto:${S.email}?subject=${encodeURIComponent(v.subject)}&body=${encodeURIComponent(`From: ${v.name} <${v.email}>\n\n${v.message}`)}`;ok.textContent="Your email app should open with the message prefilled. Nothing is sent until you press send there."};
</script></body></html>
